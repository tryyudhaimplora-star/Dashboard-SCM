<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Dashboard Demand Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#e3e6eb;--ac:#2f5fd0;--ok:#16794c;--wr:#b86e00;--er:#c0362c;--okb:#e3f4ea;--wrb:#fdf0d8;--erb:#fbe5e3}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2c3440;--ac:#7ea2f5;--ok:#58c58f;--wr:#e8a94a;--er:#f0766b;--okb:#17352a;--wrb:#3a2d14;--erb:#3d1f1c}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-size:16px;margin-right:8px}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:16px;max-width:1200px;margin:auto}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.k{font-size:24px;font-weight:650}.m{color:var(--mu);font-size:12px}h3{margin:0 0 8px;font-size:15px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600;font-size:12px}
td.r,th.r{text-align:right}tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
input,select,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
td input{width:76px;text-align:right}
.t{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px}
.ok{background:var(--okb);color:var(--ok)}.wr{background:var(--wrb);color:var(--wr)}.er{background:var(--erb);color:var(--er)}.nu{background:var(--bg);color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}.bar i{display:block;height:14px;border-radius:3px;background:var(--ac)}.bar i.d{background:var(--bd)}
.bar span.l{width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col{display:flex;align-items:flex-end;gap:4px;height:120px}.col div{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:1px;position:relative}
.col div span{position:absolute;bottom:-18px;left:0;font-size:9px;color:var(--mu)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9}
img.sj{max-width:200px;border-radius:8px;border:1px solid var(--bd)}
</style></head><body>
<header><b>Demand Planner</b><nav id="nav"></nav><span id="sy" class="m" style="margin-left:auto"></span></header>
<main id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),today=new Date().toISOString().slice(0,10);
const D={stock:{},vs:{},pc:{},names:{},sales:{},po:[],ov:{},cfg:{win:30,lt:14,ss:7,cover:30,fast:70,pot:90}};
let S=D;try{S=Object.assign(D,JSON.parse(localStorage.getItem('dp1')||'{}'))}catch(e){}
let ap='1',ae='',af='',at='',tab='dash',sub='rec',sel='',rp='7',rf='',rt='',dd='',img='';
// ---- Sinkronisasi tim (Supabase). Isi FIXED agar semua anggota tim otomatis tersambung, atau isi lewat menu Upload Data. ----
const FIXED={url:'https://pxmoxmvyfzulavanghqa.supabase.co',key:'sb_publishable_tk6IHy-GyjIknp8NsexI6g_Q4RFGVsS'};
let SB=FIXED.url?FIXED:(()=>{try{return JSON.parse(localStorage.getItem('dp_sb'))||{url:'',key:''}}catch(e){return{url:'',key:''}}})(),lastRem='',tm=null;
const sbH=()=>{const h={apikey:SB.key,'Content-Type':'application/json'};if(SB.key.startsWith('eyJ'))h.Authorization='Bearer '+SB.key;return h},sy=m=>{const e=$('#sy');if(e)e.textContent=m},hm=()=>new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
async function sbPull(force){if(!SB.url)return;try{const r=await fetch(SB.url+'/rest/v1/dp_state?id=eq.main&select=data,updated_at',{headers:sbH()});if(!r.ok)throw r.status;const j=await r.json();if(j.length){if(force||j[0].updated_at!==lastRem){lastRem=j[0].updated_at;Object.assign(S,j[0].data);try{localStorage.setItem('dp1',JSON.stringify(S))}catch(e){}render()}sy('☁ Tersinkron '+hm())}else await sbPush()}catch(e){sy('⚠ Sinkron gagal'+(typeof e=='number'?' (kode '+e+')':' (cek URL/jaringan)'))}}
async function sbPush(){if(!SB.url)return;try{const t=new Date().toISOString(),r=await fetch(SB.url+'/rest/v1/dp_state?on_conflict=id',{method:'POST',headers:{...sbH(),Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:'main',data:S,updated_at:t})});if(!r.ok)throw r.status;lastRem=t;sy('☁ Tersimpan '+hm())}catch(e){sy('⚠ Gagal menyimpan'+(typeof e=='number'?' (kode '+e+')':' (cek URL/jaringan)'))}}
const save=()=>{try{localStorage.setItem('dp1',JSON.stringify(S))}catch(e){toast('Penyimpanan browser penuh')}clearTimeout(tm);if(SB.url){sy('… menyimpan');tm=setTimeout(sbPush,1200)}};
function syncInit(){if(SB.url){sbPull(true);setInterval(()=>sbPull(false),30000)}else sy('Mode lokal (belum tersinkron)')}
function setSB(){SB={url:$('#sbu').value.trim().replace(/\/$/,''),key:$('#sbk').value.trim()};localStorage.setItem('dp_sb',JSON.stringify(SB));location.reload()}
const sbCard=()=>`<div class="c"><h3>Sinkronisasi tim (Supabase)</h3><div class="m">Isi sekali di tiap perangkat, atau tanam di file (lihat README). Data stok, penjualan, PO, dan pengaturan dipakai bersama. Jika dua orang menyimpan bersamaan, yang terakhir menyimpan menang.</div><div class="row"><input id="sbu" placeholder="https://xxxx.supabase.co" value="${SB.url}" style="min-width:260px"><input id="sbk" placeholder="anon public key" value="${SB.key}" style="min-width:260px"><button class="btn p" onclick="setSB()">Simpan dan sambungkan</button></div></div>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)};
const add=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const f=v=>v===Infinity||v==null?'∞':(Math.round(v*10)/10).toLocaleString('id-ID');
const cs=s=>String(s).trim().replace(/['"<>\\]/g,'');
function pd(v){if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
if(typeof v=='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
let m=String(v).match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
m=String(v).match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):null}
const g=(r,n)=>{for(const k in r)if(n.includes(k.toLowerCase().trim()))return r[k];return undefined};
function readF(file,cb){const fr=new FileReader();fr.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});cb(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}))};fr.readAsArrayBuffer(file)}
function upStock(i){const fl=i.files[0];if(!fl)return;readF(fl,rs=>{const st={};let n=0;rs.forEach(r=>{const k=cs(g(r,['sku','kode','kode sku'])||'');if(!k)return;st[k]=(+g(r,['stok','stock','qty','sisa stok'])||0);const nm=g(r,['nama','name','nama produk']);if(nm)S.names[k]=nm;const pc=g(r,['kategori','kategori produk','category']);if(pc)S.pc[k]=cs(pc);const lt=g(r,['leadtime','lead time','lt']);if(lt)(S.ov[k]=S.ov[k]||{}).lt=+lt;n++});S.stock=st;save();toast(n+' SKU stok ditimpa dengan file terbaru');render()})}
function upSales(i){const fl=i.files[0];if(!fl)return;readF(fl,rs=>{let n=0,mn='9',mx='';rs.forEach(r=>{const k=cs(g(r,['sku','kode','kode sku'])||''),d=pd(g(r,['tanggal','date','tgl'])),q=+g(r,['qty','jumlah','terjual','penjualan']);if(!k||!d||isNaN(q))return;(S.sales[k]=S.sales[k]||{})[d]=q;const nm=g(r,['nama','name','nama produk']);if(nm&&!S.names[k])S.names[k]=nm;const pc=g(r,['kategori','kategori produk','category']);if(pc)S.pc[k]=cs(pc);n++;if(d<mn)mn=d;if(d>mx)mx=d});save();toast(n+' baris ditambahkan/diperbarui ('+mn+' s/d '+mx+')');render()})}
const maxD=()=>{let m='';for(const k in S.sales)for(const d in S.sales[k])if(d>m)m=d;return m||today};
const sum=(k,a,b)=>{let t=0;const o=S.sales[k];if(o)for(const d in o)if(d>=a&&d<=b)t+=o[d];return t};
const t20=(k,md)=>{const v=Object.entries(S.sales[k]||{}).filter(z=>z[0]>=add(md,-364)&&z[0]<=md).map(z=>z[1]).sort((a,b)=>b-a).slice(0,20);return v.length?v.reduce((u,x)=>u+x,0)/v.length:0};
function R(){const md=maxD(),W=+S.cfg.win,fr=add(md,-W+1),c=S.cfg,out=[];
new Set([...Object.keys(S.stock),...Object.keys(S.sales)]).forEach(k=>{const o=S.ov[k]||{},q=sum(k,fr,md),y=sum(k,add(md,-364),md),q7=sum(k,add(md,-6),md);
const stock=S.stock[k]||0,tr=S.po.filter(p=>p.sku==k&&p.st=='transit').reduce((a,p)=>a+p.qty,0),os=S.po.filter(p=>p.sku==k&&p.st=='os').reduce((a,p)=>a+p.qty,0),tot=stock+tr;
let hid=false,avg=q/W;if(o.avg!=null)avg=o.avg;else if(q==0&&y>0&&tot==0){avg=t20(k,md);hid=true}
const lt=o.lt??c.lt,ss=o.ss??c.ss,rop=avg*(lt+ss),sug=Math.max(0,Math.ceil(avg*(lt+ss+ +c.cover)-tot)),qty=o.po??sug;
const doi=avg>0?tot/avg:Infinity,after=avg>0?(tot+qty)/avg-lt:Infinity,lift=q>0?((q7/7)/(q/W)-1)*100:0;
let st=['Aman','ok'];if(tot<=0)st=['Habis','er'];else if(doi<lt)st=['Kritis','er'];else if(tot<=rop)st=['Re-order','wr'];else if(doi>90)st=['Overstock','nu'];
out.push({k,nm:S.names[k]||'',stock,tr,os,tot,avg,lt,ss,rop,sug,qty,doi,after,q,y,lift,hid,st,ovr:o})});
const tq=out.reduce((a,r)=>a+r.q,0);let cum=0;out.sort((a,b)=>b.q-a.q).forEach(r=>{cum+=r.q;const p=tq?cum/tq*100:100;r.cat=r.q==0?'Slow Move':(p-r.q/tq*100<c.fast)?'Fast Move':(p-r.q/tq*100<c.pot)?'Potential':'Slow Move'});return out}
const catT=c=>`<span class="t ${c=='Fast Move'?'ok':c=='Potential'?'wr':'nu'}">${c}</span>`;
const stT=s=>`<span class="t ${s[1]}">${s[0]}</span>`;
function setOv(k,f,v){const o=S.ov[k]=S.ov[k]||{};if(v===''||v==null)delete o[f];else o[f]=+v;save();render()}
function mkPO(k,q){const r=R().find(x=>x.k==k);q=q??r.qty;if(q>0)S.po.push({id:Date.now()+Math.random(),sku:k,qty:q,st:'os',dt:today});if(S.ov[k])delete S.ov[k].po;save();render()}
function manualPO(){const k=cs($('#msku').value),q=+$('#mqty').value;if(!k||!(q>0))return toast('Isi SKU dan qty');if(!S.names[k]&&!S.stock[k]&&!S.sales[k])S.names[k]='';S.po.push({id:Date.now(),sku:k,qty:q,st:'os',dt:today});save();render()}
const poById=i=>S.po.find(p=>p.id==i);
function toTr(i){const p=poById(i);p.st='transit';save();render()}
function del(i){S.po=S.po.filter(p=>p.id!=i);save();render()}
function sj(){const ls=$('#sjl').value.split('\n');let n=0;ls.forEach(l=>{const m=l.split(/[,;\t]/);const k=cs(m[0]||''),q=+m[1];if(!k||!(q>0))return;let left=q;S.po.filter(p=>p.sku==k&&p.st=='os').forEach(p=>{const t=Math.min(p.qty,left);p.qty-=t;left-=t});S.po=S.po.filter(p=>p.qty>0);S.po.push({id:Date.now()+n,sku:k,qty:q,st:'transit',dt:today});n++});save();img='';toast(n+' SKU masuk In Transit');render()}
function setCfg(k,v){S.cfg[k]=+v;save();render()}
function demo(){let x=7;const rnd=()=>(x=x*16807%2147483647)/2147483647;S.stock={};S.names={};S.pc={};S.sales={};S.po=[];S.ov={};
for(let i=1;i<=24;i++){const k='SKU'+String(i).padStart(3,'0');S.names[k]='Produk Contoh '+i;S.pc[k]='Kategori '+String.fromCharCode(65+i%5);S.sales[k]={};const b=Math.max(1,Math.round(60/Math.pow(i,.9)*(.5+rnd())));S.stock[k]=i%9==0?0:Math.round(b*(5+rnd()*50));
for(let d=0;d<400;d++){if(i%9==0&&d<60)continue;let q=Math.round(b*(.4+rnd()*1.2));if(d<5&&i%4==0)q*=3;if(q)S.sales[k][add(today,-d)]=q}}
S.vs={};Object.keys(S.stock).forEach((k,i)=>S.vs[k]={q:Math.round(200+rnd()*800),v:'Vendor '+(i%3+1)});save();toast('Data demo dimuat');render()}
function reset(){if(confirm('Hapus semua data tersimpan di browser ini?')){localStorage.removeItem('dp1');location.reload()}}
const tbl=(h,b)=>`<div class="w"><table><tr>${h.map(x=>`<th class="${x[0]=='#'?'r':''}">${x.replace('#','')}</th>`).join('')}</tr>${b}</table></div>`;
const gp=(x,y)=>y>0?(x/y-1)*100:null,gt=v=>v==null?'<span class="m">-</span>':v>0?`<span class="t ok">▲ ${f(v)}%</span>`:v<0?`<span class="t er">▼ ${f(-v)}%</span>`:'0%';
function pDash(){const rs=R(),md=maxD();if(!rs.length)return`<div class="c"><h3>Belum ada data</h3><p>Buka menu Upload Data, atau coba dulu dengan data contoh.</p><button class="btn p" onclick="demo()">Muat data demo</button></div>`;
const tq=(a,b)=>Object.keys(S.sales).reduce((u,k)=>u+sum(k,a,b),0),q0=tq(md,md),q1=tq(add(md,-1),add(md,-1)),a7=tq(add(md,-7),add(md,-1))/7,a30=tq(add(md,-30),add(md,-1))/30;
const rkm=(a,b)=>{const l=Object.keys(S.sales).map(k=>[k,sum(k,a,b)]).filter(z=>z[1]>0).sort((p,q)=>q[1]-p[1]),m={};l.forEach((z,i)=>m[z[0]]=i+1);return m},cu=rkm(add(md,-6),md),pv=rkm(add(md,-13),add(md,-7)),mv=Object.keys(cu).filter(k=>pv[k]).map(k=>[k,pv[k]-cu[k]]),up=mv.filter(z=>z[1]>0).sort((p,q)=>q[1]-p[1]).slice(0,5),dn=mv.filter(z=>z[1]<0).sort((p,q)=>p[1]-q[1]).slice(0,5),spike=rs.filter(r=>r.lift>=30).sort((p,q)=>q.lift-p.lift).slice(0,5),nm=k=>k+' '+(S.names[k]||'');
const lost=rs.filter(r=>r.stock==0&&S.sales[r.k]).map(r=>{const ds=Object.keys(S.sales[r.k]).sort(),la=ds[ds.length-1],days=Math.min(365,Math.round((new Date(md)-new Date(la))/864e5));return{r,days,pa:sum(r.k,add(la,-29),la)/30}}).map(x=>({...x,l:x.pa*x.days})).filter(x=>x.l>0).sort((p,q)=>q.l-p.l);
const dead=rs.filter(r=>r.stock>0&&(r.doi>180||sum(r.k,add(md,-89),md)==0)).sort((p,q)=>q.stock-p.stock);
const sc={Habis:0,Kritis:0,'Re-order':0,Aman:0,Overstock:0},cc={'Fast Move':0,'Potential':0,'Slow Move':0};rs.forEach(r=>{sc[r.st[0]]++;cc[r.cat]++});const nz=o=>Object.fromEntries(Object.entries(o).filter(z=>z[1]>0));
const need=rs.filter(r=>r.sug>0&&r.os==0),crit=rs.filter(r=>r.st[0]=='Kritis'||r.st[0]=='Habis'&&r.avg>0),fu=S.po.filter(p=>p.st=='os'&&(S.stock[p.sku]||0)>=p.qty),hid=rs.filter(r=>r.stock==0&&r.tr==0&&r.q==0&&r.y>0&&S.vs[r.k]&&S.vs[r.k].q>0);
const G='style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin:0 0 14px"',mini=(l,v,x)=>`<div><div class="m">${l}</div><div class="k">${v}</div><div class="m">${x}</div></div>`;
return`<div class="g"><div class="c"><div class="m">Total SKU</div><div class="k">${rs.length}</div></div><div class="c"><div class="m">Perlu PO</div><div class="k">${need.length}</div></div><div class="c"><div class="m">Stok kritis (DOI &lt; LT)</div><div class="k">${crit.length}</div></div><div class="c"><div class="m">Follow up PO OS</div><div class="k">${fu.length}</div></div><div class="c"><div class="m">Data penjualan s/d</div><div class="k" style="font-size:18px">${md}</div></div></div>
<div class="c"><h3>Ringkasan penjualan hari terakhir (${md})</h3><div class="g" style="margin:0">${mini('Qty hari ini',f(q0),'')}${mini('vs kemarin',gt(gp(q0,q1)),'kemarin '+f(q1))}${mini('vs rata-rata 7 hari',gt(gp(q0,a7)),'rata-rata '+f(a7))}${mini('vs rata-rata 30 hari',gt(gp(q0,a30)),'rata-rata '+f(a30))}</div></div>
<div class="g" ${G}><div class="c" style="margin:0"><h3>Sebaran status stok (jumlah SKU)</h3>${pie(nz(sc))}</div><div class="c" style="margin:0"><h3>Fast / Potential / Slow Move (jumlah SKU)</h3>${pie(nz(cc))}</div></div>
<div class="g" ${G}><div class="c" style="margin:0"><h3>Top 5 naik peringkat</h3><div class="m">7 hari terakhir dibanding 7 hari sebelumnya</div>${up.map(z=>`<div>${nm(z[0])}: <span class="t ok">▲ ${z[1]}</span> (#${pv[z[0]]} → #${cu[z[0]]})</div>`).join('')||'<span class="m">-</span>'}</div><div class="c" style="margin:0"><h3>Top 5 turun peringkat</h3><div class="m">7 hari terakhir dibanding 7 hari sebelumnya</div>${dn.map(z=>`<div>${nm(z[0])}: <span class="t er">▼ ${-z[1]}</span> (#${pv[z[0]]} → #${cu[z[0]]})</div>`).join('')||'<span class="m">-</span>'}</div><div class="c" style="margin:0"><h3>SKU sedang lonjakan (campaign?)</h3><div class="m">Rata-rata 7 hari terakhir ≥ 30% di atas rata-rata periode avg</div>${spike.map(r=>`<div>${nm(r.k)}: <span class="t ok">▲ ${f(r.lift)}%</span></div>`).join('')||'<span class="m">-</span>'}</div></div>

<div class="c"><h3>Stok mati dan overstock</h3><div class="m">DOI &gt; 180 hari atau tanpa penjualan 90 hari. ${dead.length} SKU, total ${f(dead.reduce((u,r)=>u+r.stock,0))} unit.</div>${dead.length?tbl(['SKU','Nama','#Stok gudang','Alasan'],dead.slice(0,10).map(r=>`<tr><td>${r.k}</td><td>${r.nm}</td><td class="r">${f(r.stock)}</td><td>${sum(r.k,add(md,-89),md)==0?'Tanpa penjualan 90 hari':'DOI '+f(r.doi)+' hari'}</td></tr>`).join('')):'<span class="m">Tidak ada.</span>'}</div>
